spring.application.name=spring-boot-chatbot
spring.config.import=optional:file:.env[.properties]
ai.api-key=${AI_API_KEY}
ai.model=${AI_MODEL}
ai.base-url=https://openrouter.ai/api/v1
conversation.session.max-size=1000
conversation.session.expire-minutes=30
conversation.session.max-history=20
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
ai.retry.max-retries=3
ai.retry.delay=1000
ai.retry.multiplier=2
