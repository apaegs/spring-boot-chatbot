<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="window">
    <div class="titlebar">
        <span>AI ChatBot</span>
        <div class="btns">
            <div class="btn"></div>
            <div class="btn"></div>
        </div>
    </div>

    <div class="pills">
        <button class="pill active" onclick="selectPersonality('music-nerd', this)">MUSIC_NERD</button>
        <button class="pill" onclick="selectPersonality('dungeon-master', this)">DUNGEON_MASTER</button>
        <button class="pill" onclick="selectPersonality('expert-coder', this)">EXPERT_CODER</button>
    </div>

    <div class="messages" id="messages">
        <div class="msg bot">
            <div class="lbl">// SYSTEM</div>
            READY. SELECT PERSONALITY AND TYPE YOUR MESSAGE.
        </div>
    </div>

    <div class="input-area">
        <div class="input-titlebar">
            <span></span>
            <div class="btns">
                <div class="btn"></div>
                <div class="btn"></div>
            </div>
        </div>
        <div class="input-row">
            <span class="prompt">USER:</span>
            <input
                    type="text"
                    id="input"
                    placeholder="type here..."
                    onkeydown="if(event.key === 'Enter') sendMessage()"
            />
            <button id="send-btn" onclick="sendMessage()">ENTER</button>
        </div>
    </div>
</div>

<script>
    let currentPersonality = 'music-nerd';
    let sessionId = crypto.randomUUID();

    function selectPersonality(personality, el) {
        currentPersonality = personality;
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
    }

    async function sendMessage() {
        const input = document.getElementById('input');
        const message = input.value.trim();
        if (!message) return;

        const capturedPersonality = currentPersonality;

        input.value = '';
        appendMessage('user', message, null);
        setLoading(true);

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);

        try {
            const response = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify({
                    personality: capturedPersonality,
                    message: message,
                    sessionId: sessionId
                })
            });

            if (!response.ok) {
                try {
                    const errorData = await response.json();
                    const err = errorData?.error || errorData?.type || 'Unknown error';
                    const msg = errorData?.message || errorData?.detail || 'No message provided';
                    appendMessage('bot', `** ERROR: ${err} — ${msg} **`, null);
                } catch {
                    appendMessage('bot', '** ERROR: COULD NOT REACH AI SERVICE **', null);
                }
                return;
            }

            const data = await response.json();
            appendMessage('bot', data.reply, capturedPersonality);
        } catch (error) {
            if (error.name === 'AbortError') {
                appendMessage('bot', '** ERROR: REQUEST TIMED OUT **', null);
            } else {
                appendMessage('bot', '** ERROR: COULD NOT REACH AI SERVICE **', null);
            }
        } finally {
            clearTimeout(timeout);
            setLoading(false);
        }
    }

    function appendMessage(role, text, personality) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.classList.add('msg', role);

        const label = document.createElement('div');
        label.classList.add('lbl');
        label.textContent = role === 'user' ? '// YOU' : '// ' + (personality ? personality.toUpperCase() : 'SYSTEM');
        div.appendChild(label);

        const content = document.createElement('span');
        content.textContent = text;
        div.appendChild(content);

        if (role === 'bot') {
            const cursor = document.createElement('span');
            cursor.classList.add('cursor');
            div.appendChild(cursor);
            setTimeout(() => cursor.remove(), 3000);
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function setLoading(loading) {
        const btn = document.getElementById('send-btn');
        const input = document.getElementById('input');
        btn.disabled = loading;
        input.disabled = loading;

        if (loading) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.classList.add('msg', 'bot');
            div.id = 'typing';
            div.innerHTML = '<div class="lbl">// SYSTEM</div>PROCESSING <span class="cursor"></span>';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        } else {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }
    }
</script>

</body>
</html>
